name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v prefix (e.g. 0.1.0) — must match an existing git tag'
        required: true

permissions:
  contents: write
  packages: write
  pages:    write

jobs:
  resolve:
    name: Resolve Release Ref
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      ref: ${{ steps.ver.outputs.ref }}
    steps:
      - name: Resolve version and ref
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "ref=refs/tags/v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Verify
    needs: [resolve]
    runs-on: ubuntu-latest
    steps:
      # Checking out by tag ref means a manual workflow_dispatch run fails fast
      # here if the tag was never pushed, instead of publishing an untagged release.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go vet & test
        run: |
          go vet ./...
          go test ./... -race

      - uses: azure/setup-helm@v4
        with:
          version: 'v3.21.0'

      - name: Helm lint
        run: |
          helm lint charts/rancher-secrets-manager
          helm lint charts/rancher-secrets-manager-ui

      - uses: actions/setup-node@v4
        with:
          node-version-file: ui/.nvmrc
          cache: yarn
          cache-dependency-path: ui/yarn.lock

      - name: UI lint
        working-directory: ui
        run: |
          yarn install --frozen-lockfile
          yarn lint

  release:
    name: Build & Publish
    needs: [resolve, verify]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          fetch-depth: 0

      # ── Container image ─────────────────────────────────────────────────────
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.resolve.outputs.version }}
            ghcr.io/${{ github.repository }}:latest

      # ── UI extension bundle ──────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version-file: ui/.nvmrc
          cache: yarn
          cache-dependency-path: ui/yarn.lock

      - name: Build extension bundle
        working-directory: ui
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          yarn install --frozen-lockfile
          # Stamp the plugin package.json so the bundled metadata matches the release version.
          # build-pkg.sh copies this file verbatim into the dist; Rancher reads it to display
          # the extension version in the Extensions UI.
          jq --arg v "$VERSION" '.version = $v' \
            pkg/rancher-secrets-manager/package.json > /tmp/_pkg.json
          mv /tmp/_pkg.json pkg/rancher-secrets-manager/package.json
          yarn build-pkg

      # ── Helm charts + gh-pages publish ──────────────────────────────────────
      - uses: azure/setup-helm@v4
        with:
          version: 'v3.21.0'  # Helm 4 changed repo index to not scan subdirs

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Package controller chart
        run: |
          helm package charts/rancher-secrets-manager \
            --version "${{ needs.resolve.outputs.version }}" \
            --app-version "${{ needs.resolve.outputs.version }}" \
            --destination gh-pages/

      - name: Package UI extension Helm chart
        run: |
          helm package charts/rancher-secrets-manager-ui \
            --version "${{ needs.resolve.outputs.version }}" \
            --app-version "${{ needs.resolve.outputs.version }}" \
            --destination gh-pages/

      - name: Copy extension JS bundles
        run: |
          PLUGIN_DIR="gh-pages/extensions/rancher-secrets-manager/${{ needs.resolve.outputs.version }}/plugin"
          mkdir -p "$PLUGIN_DIR"
          # dist-pkg folder is named <package>-<version>
          cp -r ui/dist-pkg/rancher-secrets-manager-${{ needs.resolve.outputs.version }}/. "$PLUGIN_DIR/"
          # Generate files.txt manifest required by Rancher's UI plugin caching system.
          # Format: "<sha256> <relative-path>", one entry per file.
          cd "$PLUGIN_DIR"
          find . -type f | sort | while read -r f; do
            sha256sum "$f" | awk '{sub(/^\.\//, "", $2); print $1, $2}'
          done > files.txt

      - name: Regenerate Helm repo index
        run: |
          PAGES_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          # helm repo index scans only the root of the given dir (no recursion),
          # so charts must live at the root of gh-pages, not in subdirectories.
          helm repo index gh-pages --url "$PAGES_URL" --merge gh-pages/index.yaml

      - name: Commit and push gh-pages
        run: |
          cd gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Release ${{ needs.resolve.outputs.version }}"
          git push

      # ── GitHub Release ───────────────────────────────────────────────────────
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ needs.resolve.outputs.version }}" \
            --title "v${{ needs.resolve.outputs.version }}" \
            --generate-notes

      # ── Sync Chart.yaml on main ──────────────────────────────────────────────
      # helm package (above) sets the released version via --version/--app-version
      # regardless of what's checked into Chart.yaml, so this is bookkeeping only:
      # keeps the source files from drifting away from the last released version.
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-checkout

      - name: Sync Chart.yaml versions to main
        run: |
          VERSION="${{ needs.resolve.outputs.version }}"
          for f in main-checkout/charts/rancher-secrets-manager/Chart.yaml \
                   main-checkout/charts/rancher-secrets-manager-ui/Chart.yaml; do
            sed -i -E "s/^version: .*/version: ${VERSION}/" "$f"
            sed -i -E "s/^appVersion: .*/appVersion: \"${VERSION}\"/" "$f"
          done
          cd main-checkout
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/rancher-secrets-manager/Chart.yaml charts/rancher-secrets-manager-ui/Chart.yaml
          git diff --cached --quiet || git commit -m "chore(release): sync Chart.yaml to v${VERSION} [skip ci]"
          git diff --cached --quiet || git push
