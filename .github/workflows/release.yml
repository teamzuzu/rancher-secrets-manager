name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v prefix (e.g. 0.1.0)'
        required: true

permissions:
  contents: write
  packages: write
  pages:    write

jobs:
  release:
    name: Build & Publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      # ── Container image ─────────────────────────────────────────────────────
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository }}:latest

      # ── UI extension bundle ──────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version-file: ui/.nvmrc
          cache: yarn
          cache-dependency-path: ui/yarn.lock

      - name: Build extension bundle
        working-directory: ui
        run: |
          yarn install --frozen-lockfile
          yarn build-pkg

      # ── Helm charts + gh-pages publish ──────────────────────────────────────
      - uses: azure/setup-helm@v4
        with:
          version: '3.x'  # Helm 4 changed repo index to not scan subdirs

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Package controller chart
        run: |
          mkdir -p gh-pages/assets/rancher-secrets-manager
          helm package charts/rancher-secrets-manager \
            --version "${{ steps.ver.outputs.version }}" \
            --app-version "${{ steps.ver.outputs.version }}" \
            --destination gh-pages/assets/rancher-secrets-manager/

      - name: Package UI extension Helm chart
        run: |
          mkdir -p gh-pages/assets/rancher-secrets-manager-ui
          helm package charts/rancher-secrets-manager-ui \
            --version "${{ steps.ver.outputs.version }}" \
            --app-version "${{ steps.ver.outputs.version }}" \
            --destination gh-pages/assets/rancher-secrets-manager-ui/

      - name: Copy extension JS bundles
        run: |
          PLUGIN_DIR="gh-pages/extensions/rancher-secrets-manager/${{ steps.ver.outputs.version }}/plugin"
          mkdir -p "$PLUGIN_DIR"
          # dist-pkg folder is named <package>-<version>
          cp -r ui/dist-pkg/rancher-secrets-manager-${{ steps.ver.outputs.version }}/. "$PLUGIN_DIR/"

      - name: Regenerate Helm repo index
        run: |
          PAGES_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          cd gh-pages
          # Merge into the existing index so old versions are preserved
          helm repo index . --url "$PAGES_URL" --merge index.yaml

      - name: Commit and push gh-pages
        run: |
          cd gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Release ${{ steps.ver.outputs.version }}"
          git push
