replicaCount: 1

image:
  repository: ghcr.io/teamzuzu/rancher-secrets-manager
  pullPolicy: IfNotPresent
  tag: ""  # defaults to .Chart.AppVersion

imagePullSecrets: []

rancher:
  # url is the base URL of the Rancher API reachable from inside the management cluster.
  # Defaults to the internal service address.
  url: "https://rancher.cattle-system"
  # insecureTLS skips TLS verification. Use only in development.
  insecureTLS: false
  # caBundlePEM is the PEM-encoded CA certificate to trust for the Rancher endpoint.
  # When set, the chart creates a Secret and mounts it into the controller pod automatically.
  # Obtain from: kubectl get secret tls-rancher-internal-ca -n cattle-system -o jsonpath='{.data.tls\.crt}' | base64 -d
  caBundlePEM: ""

leaderElection:
  enabled: true

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}
