apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: managedsecrets.secrets.cattle.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.4
    meta.helm.sh/release-name: rancher-secrets-manager
    meta.helm.sh/release-namespace: cattle-secrets-system
  labels:
    app.kubernetes.io/managed-by: Helm
spec:
  group: secrets.cattle.io
  names:
    kind: ManagedSecret
    listKind: ManagedSecretList
    plural: managedsecrets
    singular: managedsecret
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Source Secret
          type: string
          jsonPath: .spec.secretRef.name
        - name: Targets
          type: integer
          jsonPath: .status.targetCount
        - name: Synced
          type: integer
          jsonPath: .status.syncedCount
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [secretRef, targets]
              properties:
                secretRef:
                  type: object
                  required: [name, namespace]
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                paused:
                  type: boolean
                  description: >
                    When true, all sync operations are suspended. Secrets already
                    synced to downstream clusters are left in place.
                targets:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [namespace]
                    properties:
                      clusterName:
                        type: string
                      clusterSelector:
                        type: object
                        properties:
                          matchLabels:
                            type: object
                            additionalProperties:
                              type: string
                          matchExpressions:
                            type: array
                            items:
                              type: object
                              required: [key, operator]
                              properties:
                                key:
                                  type: string
                                operator:
                                  type: string
                                  enum: [In, NotIn, Exists, DoesNotExist]
                                values:
                                  type: array
                                  items:
                                    type: string
                      namespace:
                        type: string
                      secretName:
                        type: string
            status:
              type: object
              properties:
                targetCount:
                  type: integer
                syncedCount:
                  type: integer
                syncStatus:
                  type: array
                  items:
                    type: object
                    required: [clusterName, clusterId, namespace, secretName, status]
                    properties:
                      clusterName:
                        type: string
                      clusterId:
                        type: string
                      namespace:
                        type: string
                      secretName:
                        type: string
                      status:
                        type: string
                        enum: [Synced, Failed, Pending]
                      message:
                        type: string
                      lastSyncTime:
                        type: string
                        format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, reason, message, lastTransitionTime]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      observedGeneration:
                        type: integer
