apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rsm.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rsm.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "rsm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rsm.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "rsm.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: {{ include "rsm.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --rancher-url={{ .Values.rancher.url }}
            - --insecure-tls={{ .Values.rancher.insecureTLS }}
            - --leader-elect={{ .Values.leaderElection.enabled }}
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            {{- if .Values.rancher.caBundlePEM }}
            - --ca-bundle=/etc/rancher-secrets-manager/ca.crt
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.rancher.caBundlePEM }}
          volumeMounts:
            - name: rancher-ca
              mountPath: /etc/rancher-secrets-manager
              readOnly: true
          {{- end }}
      {{- if .Values.rancher.caBundlePEM }}
      volumes:
        - name: rancher-ca
          secret:
            secretName: {{ include "rsm.fullname" . }}-ca
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
